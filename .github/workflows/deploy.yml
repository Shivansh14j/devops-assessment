name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Backend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest ./backend

    - name: Push Backend
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest

    - name: Build Frontend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest ./frontend

    - name: Push Frontend
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest

          docker stop backend || true
          docker stop frontend || true

          docker rm backend || true
          docker rm frontend || true

          docker run -d -p 8000:8000 --name backend ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest
          docker run -d -p 80:5173 --name frontend ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest