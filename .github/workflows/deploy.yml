```yaml
name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Login to GitHub Container Registry automatically
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Build Backend Image
      - name: Build Backend Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:latest ./backend

      # Push Backend Image
      - name: Push Backend Image
        run: |
          docker push ghcr.io/${{ github.repository }}/backend:latest

      # Build Frontend Image
      - name: Build Frontend Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/frontend:latest ./frontend

      # Push Frontend Image
      - name: Push Frontend Image
        run: |
          docker push ghcr.io/${{ github.repository }}/frontend:latest

      # Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            docker pull ghcr.io/${{ github.repository }}/backend:latest
            docker pull ghcr.io/${{ github.repository }}/frontend:latest

            docker stop backend || true
            docker stop frontend || true

            docker rm backend || true
            docker rm frontend || true

            docker run -d -p 8000:8000 --name backend ghcr.io/${{ github.repository }}/backend:latest
            docker run -d -p 80:5173 --name frontend ghcr.io/${{ github.repository }}/frontend:latest
```
